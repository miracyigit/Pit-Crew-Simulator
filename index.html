<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Pitwall Telemetry Simulator</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131b2e;
            --border-color: #1f293d;
            --accent-red: #e10600;
            --accent-green: #00ff66;
            --accent-yellow: #ffcc00;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .dashboard {
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        .badge {
            background: var(--accent-red);
            color: white;
            padding: 5px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .telemetry-panel, .standings-panel {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .metric {
            margin-bottom: 15px;
        }

        .metric-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #1f293d;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .radio-box {
            background: #080c14;
            border-left: 4px solid var(--accent-red);
            padding: 12px;
            margin: 20px 0;
            border-radius: 0 6px 6px 0;
            font-style: italic;
            font-size: 14px;
            color: #d1d5db;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        button {
            background: #1f293d;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button:hover:not(:disabled) {
            background: var(--accent-red);
            border-color: var(--accent-red);
            color: white;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .standings-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 14px;
        }

        .standings-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .standings-item.player {
            background: rgba(225, 6, 0, 0.2);
            border-left: 3px solid var(--accent-red);
            font-weight: bold;
        }

        .screen-overlay {
            text-align: center;
            padding: 40px 20px;
        }

        .screen-overlay h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .screen-overlay p {
            color: var(--text-muted);
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="dashboard" id="app">
    <!-- Header -->
    <div class="header">
        <h1>🏎️ F1 PITWALL TELEMETRY</h1>
        <div class="badge" id="lap-badge">LAP 1 / 30</div>
    </div>

    <div id="game-area">
        <div class="grid-container">
            <!-- Sol Panel: Telemetri ve Kontroller -->
            <div>
                <div class="telemetry-panel">
                    <!-- Tyre Wear -->
                    <div class="metric">
                        <div class="metric-label">
                            <span>TYRE WEAR</span>
                            <span id="val-tyre">100%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="bar-tyre" style="background: var(--accent-green);"></div>
                        </div>
                    </div>

                    <!-- Engine Temp -->
                    <div class="metric">
                        <div class="metric-label">
                            <span>ENGINE TEMP (CRITICAL: 130°C)</span>
                            <span id="val-temp">85 °C</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="bar-temp" style="background: var(--accent-green);"></div>
                        </div>
                    </div>

                    <!-- Fuel -->
                    <div class="metric">
                        <div class="metric-label">
                            <span>REMAINING FUEL</span>
                            <span id="val-fuel">100%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="bar-fuel" style="background: var(--accent-green);"></div>
                        </div>
                    </div>
                </div>

                <!-- Team Radio -->
                <div class="radio-box" id="radio-msg">
                    TEAM RADIO: "Box, box! What's our strategy for this lap?"
                </div>

                <!-- Action Buttons -->
                <div class="controls" id="controls">
                    <button onclick="makeChoice(1)">🔥 <b>Push Hard</b> <span style="font-size:12px; opacity:0.7; margin-left:auto;">Overtake / High Heat</span></button>
                    <button onclick="makeChoice(2)">⚖️ <b>Balanced Pace</b> <span style="font-size:12px; opacity:0.7; margin-left:auto;">Manage Car</span></button>
                    <button onclick="makeChoice(3)">🛠️ <b>Box for Pit-Stop</b> <span style="font-size:12px; opacity:0.7; margin-left:auto;">Fresh Tyres (+3 Pos)</span></button>
                </div>
            </div>

            <!-- Sağ Panel: Canlı Sıralama Tablosu -->
            <div class="standings-panel">
                <div style="font-weight: bold; margin-bottom: 10px; font-size: 14px; color: var(--text-muted); text-transform: uppercase;">Live Standings</div>
                <ul class="standings-list" id="standings">
                    <!-- Dinamik dolacak -->
                </ul>
            </div>
        </div>
    </div>
</div>

<script>
    let tyreWear = 100;
    let engineTemp = 85;
    let currentPosition = 10;
    let remainingFuel = 100;
    let lap = 1;
    let gameOver = false;

    // Sabit 20 araçlık pilot listesi (Görsel simülasyon için)
    const drivers = [
        "Max Verstappen", "Lando Norris", "Charles Leclerc", "Lewis Hamilton", 
        "Oscar Piastri", "Carlos Sainz", "George Russell", "Sergio Perez", 
        "Fernando Alonso", "MİRAC TOSYALI", "Lance Stroll", "Yuki Tsunoda", 
        "Alexander Albon", "Nico Hulkenberg", "Esteban Ocon", "Pierre Gasly", 
        "Valtteri Bottas", "Zhou Guanyu", "Kevin Magnussen", "Franco Colapinto"
    ];

    function updateUI() {
        if (gameOver) return;

        // Lap göstergesi
        document.getElementById("lap-badge").innerText = `LAP ${lap} / 30`;

        // Tyre Wear günceleme ve renk değişimi
        document.getElementById("val-tyre").innerText = tyreWear + "%";
        let tyreBar = document.getElementById("bar-tyre");
        tyreBar.style.width = tyreWear + "%";
        tyreBar.style.backgroundColor = tyreWear > 40 ? "var(--accent-green)" : (tyreWear > 15 ? "var(--accent-yellow)" : "var(--accent-red)");

        // Engine Temp güncelleme (Maks 130 derece üzerinden oran)
        document.getElementById("val-temp").innerText = engineTemp + " °C";
        let tempPercent = (engineTemp / 130) * 100;
        if (tempPercent > 100) tempPercent = 100;
        let tempBar = document.getElementById("bar-temp");
        tempBar.style.width = tempPercent + "%";
        tempBar.style.backgroundColor = engineTemp < 110 ? "var(--accent-green)" : (engineTemp < 125 ? "var(--accent-yellow)" : "var(--accent-red)");

        // Fuel güncelleme
        document.getElementById("val-fuel").innerText = remainingFuel + "%";
        let fuelBar = document.getElementById("bar-fuel");
        fuelBar.style.width = remainingFuel + "%";
        fuelBar.style.backgroundColor = remainingFuel > 30 ? "var(--accent-green)" : "var(--accent-red)";

        // Sıralama tablosunu render et
        renderStandings();
    }

    function renderStandings() {
        let standingsEl = document.getElementById("standings");
        standingsEl.innerHTML = "";

        // P1'den P20'ye sıralama simülasyonu
        // Oyuncunun pozisyonunu listede doğru yere yerleştiriyoruz
        let list = [];
        for (let i = 1; i <= 20; i++) {
            if (i === currentPosition) {
                list.push({ pos: i, name: "MİRAC TOSYALI (YOU)", isPlayer: true });
            } else {
                // Rastgele diğer pilotlar
                let dummyName = drivers[(i * 3) % drivers.length];
                if (dummyName === "MİRAC TOSYALI") dummyName = "Alex Albon";
                list.push({ pos: i, name: dummyName, isPlayer: false });
            }
        }

        // Listeyi pozisyona göre sırala
        list.sort((a, b) => a.pos - b.pos);

        // HTML'e bas
        list.forEach(driver => {
            let li = document.createElement("li");
            li.className = "standings-item" + (driver.isPlayer ? " player" : "");
            li.innerHTML = `<span>P${driver.pos} ${driver.name}</span>`;
            standingsEl.appendChild(li);
        });
    }

    function makeChoice(choice) {
        if (gameOver) return;

        let radioMsg = "";

        if (choice === 1) {
            currentPosition -= 1;
            if (currentPosition < 1) currentPosition = 1;
            engineTemp += 11;
            tyreWear -= 11;
            remainingFuel -= 10;
            radioMsg = "TEAM RADIO: 'Pushing hard! Great pace, keep it up!'";
        } else if (choice === 2) {
            engineTemp -= 5;
            if (engineTemp < 75) engineTemp = 75;
            tyreWear -= 5;
            remainingFuel -= 6;
            radioMsg = "TEAM RADIO: 'Copy, managing tyres and fuel delta.'";
        } else if (choice === 3) {
            currentPosition += 3;
            if (currentPosition > 20) currentPosition = 20;
            engineTemp -= 30;
            if (engineTemp < 75) engineTemp = 75;
            tyreWear = 100;
            remainingFuel = 100;
            radioMsg = "TEAM RADIO: 'Box complete! Good stop by the crew, Go!'";
        }

        document.getElementById("radio-msg").innerText = radioMsg;

        // DNF Kontrolleri
        if (engineTemp > 130 || tyreWear <= 0 || remainingFuel <= 0) {
            triggerDNF();
            return;
        }

        lap++;

        // Bitiş Kontrolü
        if (lap > 30) {
            triggerFinish();
            return;
        }

        updateUI();
    }

    function triggerDNF() {
        gameOver = true;
        document.getElementById("game-area").innerHTML = `
            <div class="screen-overlay">
                <h2 style="color: var(--accent-red);">💥 DNF - RACE OVER</h2>
                <p><b>TEAM RADIO:</b> "Massive failure! Shut down the engine, car is heavily damaged..."</p>
                <p style="font-size: 18px; color: var(--text-main);">Retired on Lap: <b>${lap} / 30</b></p>
                <button onclick="location.reload()" style="margin: 0 auto; display: block; text-align: center;">🔄 Restart Race</button>
            </div>
        `;
    }

    function triggerFinish() {
        gameOver = true;
        let isPodium = currentPosition <= 3;
        let title = isPodium ? "🏆 PODIUM CELEBRATION!" : "🏁 CHECKERED FLAG";
        let color = isPodium ? "var(--accent-yellow)" : "var(--accent-green)";
        
        document.getElementById("game-area").innerHTML = `
            <div class="screen-overlay">
                <h2 style="color: ${color};">${title}</h2>
                <p><b>TEAM RADIO:</b> "${isPodium ? 'YES! What a masterclass drive! Champagne time!' : 'Tough race out there, brought it home in one piece.'}"</p>
                <p style="font-size: 20px; color: var(--text-main);">Final Result: <b>P${currentPosition}</b></p>
                <button onclick="location.reload()" style="margin: 0 auto; display: block; text-align: center;">🔄 Race Again</button>
            </div>
        `;
    }

    // Oyunu ilk kez yükle
    updateUI();
</script>

</body>
</html>
